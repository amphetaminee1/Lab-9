<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отзовик</title>
    <style>
        body {
            background: lightgrey;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .box {
            background: white;
            width: 400px;
            padding: 20px;
            margin: auto;
            border-radius: 8px;
        }
        .review {
            border: 1px solid black;
            margin-top: 10px;
            padding: 10px;
        }
        .clear-btn {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
        }
        .clear-btn:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Отзывы</h1>

    <form method="POST">
        <p>Текст отзыва:</p>
        <textarea name="text" style="width: 100%; height: 80px;" required></textarea>
        <p>Оценка (1-5):</p>
        <input type="number" name="rate" min="1" max="5">
        <br><br>
        <input type="submit" value="Добавить отзыв" style="width: 100%; padding: 10px; cursor: pointer;">
    </form>

    <hr style="margin-top: 20px;">

    <h2>Список всех отзывов:</h2>
    {% for r in reviews %}
        <div class="review">
            <b>Текст:</b> {{ r.text }} <br>
            <b>Оценка:</b> {{ r.rate }}
        </div>
    {% endfor %}

    <form action="/clear" method="POST">
        <input type="submit" value="Clear View (Скрыть всё)" class="clear-btn">
    </form>
</div>

</body>
</html>
